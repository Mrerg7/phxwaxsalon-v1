name = "phxwax-salon"
main = "src/worker.ts"
compatibility_date = "2025-07-01"
workers_dev = true
preview_urls = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
# Disable auto /index.html → / redirects so Google does not flag "Page with redirect".
# /index.html is served with X-Robots-Tag: noindex via public/_headers instead.
html_handling = "none"
run_worker_first = true

# Bind to custom domains
[[routes]]
pattern = "phxwax.salon"
custom_domain = true

[[routes]]
pattern = "www.phxwax.salon"
custom_domain = true
